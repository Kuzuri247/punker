<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Shader Gradient -->
    <radialGradient id="punker-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <!-- Facet Gradients -->
    <linearGradient id="facet-left" x1="20" y1="24" x2="60" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="facet-top" x1="60" y1="20" x2="100" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="facet-loop" x1="60" y1="40" x2="98" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow Core -->
  <circle cx="60" cy="60" r="54" fill="url(#punker-glow)"/>

  <!-- Geometric Isometric "P" Mark -->
  <!-- Left Pillar -->
  <polygon points="32,24 50,14 50,106 32,96" fill="url(#facet-left)" />
  
  <!-- Top Roof Facet -->
  <polygon points="50,14 88,36 70,46 32,24" fill="url(#facet-top)" opacity="0.9" />

  <!-- Upper Loop Facet (forming the P head) -->
  <polygon points="50,44 88,36 96,62 78,72 50,56" fill="url(#facet-loop)" />
  
  <!-- Core Negative Space Cutout -->
  <polygon points="50,56 78,72 68,82 50,72" fill="#08090C" opacity="0.8" />
  
  <!-- Subtle Vertex Specular Points -->
  <circle cx="88" cy="36" r="2.5" fill="#E0E7FF"/>
  <circle cx="50" cy="14" r="2.5" fill="#E0E7FF"/>
  <circle cx="32" cy="24" r="2" fill="#C7D2FE"/>
</svg>
